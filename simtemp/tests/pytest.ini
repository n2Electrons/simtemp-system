[tool:pytest]
# Configure pytest to ignore test_utils.py and other utility files
collect_ignore = ["test_utils.py"]

# Only collect from test_*.py files that are actual test files
python_files = test_*.py
python_functions = test_*
python_classes = Test*

# Ignore __pycache__ and other directories
norecursedirs = __pycache__ .git .pytest_cache