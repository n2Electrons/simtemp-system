[tool:pytest]
# Configure pytest to ignore test_utils.py and other utility files
collect_ignore = ["test_utils.py", "verify_dependencies.py", "cleanup_test_artifacts.py", "driver_tester.py", "run_pr_tests.py", "run_all_tests.py", "test_monitor.py", "ensure_dtb_overlay.py", "run_dtb_binding_test.py"]

# Collect from all test_*.py files that are actual test files
python_files = test_f_k1_tc_*.py test_f_k8_tc_*.py
python_functions = test_*
python_classes = Test*

# Include all test files in results reporting and enable pytest-order plugin
addopts = -p pytest_order -v --tb=short -rA --junitxml=reports/test_results.xml --html=reports/test_report.html --self-contained-html

# Enable pytest-order plugin for test execution ordering
markers =
    order: Specify test execution order

# Ignore __pycache__ and other directories  
norecursedirs = __pycache__ .git .pytest_cache results reports

# Test discovery patterns
testpaths = .
minversion = 7.0