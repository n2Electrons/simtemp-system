# Test Configuration File for SimTemp Temperature Simulator Driver
# This file controls which tests are executed and their configurations
#
# Copyright (c) Jorge Rodriguez Moreno
#
# STRUCTURE DOCUMENTATION:
# =======================
# 
# Test Suite Required Fields:
#   - enabled: bool           # Whether the suite is active
#   - repository: str         # GitHub repository name
#   - description: str        # Human-readable suite description
#   - test_cases: list        # List of test case configurations
#
#
# Binary Paths Configuration:
#   binary_paths:
#     kernel: str                      # Path to kernel image (zImage, vmlinuz, etc.)
#     rootfs: str                      # Path to root filesystem image
#     dtb: str                         # Path to Device Tree Blob
#     driver: str                      # Path to kernel driver module (.ko)
#     qemu_script: str                 # Path to QEMU launcher script (optional)
#
# Test Case Required Fields:
#   - name: str              # Test function name
#   - description: str       # Human-readable test description
#   - enabled: bool          # Whether the test is active
#   - test_id: str          # Traceability ID (F-KX-TC-XXX format)
#   - pytest_file: str      # Python test file name
#   - verbose_output: bool  # Enable pytest -s flag for debugging

version: "1.0"

# Global test settings
global:
  verbose: true
  debug: true
  timeout_seconds: 60
  fail_fast: true

# Default binary paths (can be overridden per test suite)
default_binary_paths:
  x86:
    driver: "simtemp/kernel/obj/nxp_simtemp.ko"  # Compiled from source in host or Jenkins for x86 host testing
    # rootfs and dtb not typically used for x86 host testing
  arm_qemu:
    # ARM QEMU uses precompiled kernel, rootfs, dtb on host machine (Docker/Debian has Cross-compilation incompatibilities
    kernel: "deployment/qemu/linux-build-imx/arch/arm/boot/zImage"
    rootfs: "deployment/qemu/rootfs/rootfs.ext4"
    dtb: "deployment/qemu/imx6q-sabresd-with-simtemp.dtb"
    driver: "deployment/qemu/rootfs/tmp/prebuild/simtemp-driver/nxp_simtemp.ko"  # PRECOMPILED MODULE
    qemu_script: "deployment/qemu/scripts/start_qemu_and_wait_for_boot.sh"

# GitHub issue mappings (populated by automation)
github_issue_mappings: {}

# Test case configurations
tests:
  kernel_driver_base:
    enabled: true
    repository: "n2Electrons-Infra"
    description: "Tests for the Temperature Simulator Driver (Infrastructure)"
    binary_paths_profile: "x86"
    test_cases:
      - name: "test_insmod_registers_driver"
        description: "Verifies driver registration via insmod"
        enabled: true
        test_id: "F-K1-TC-001"
        pytest_file: "test_x86_f_k1_tc_001_insmod.py"
        verbose_output: false

  kernel_driver_suite:
    enabled: true
    repository: "simtemp-system"
    description: "Extended Tests for the Temperature Simulator Driver"
    binary_paths_profile: "x86"
    test_cases:
      - name: "test_driver_load_unload"
        description: "Load/unload kernel module without WARN/OOPS"
        enabled: true
        test_id: "F-K8-TC-001"
        pytest_file: "test_x86_f_k8_tc_001_loadunload.py"
        verbose_output: false
      - name: "test_readers_exit_gracefully_on_unload"
        description: "Readers exit gracefully on unload in host environment"
        enabled: true
        test_id: "F-K8-TC-002"
        pytest_file: "test_x86_f_k8_tc_002_graceful.py"
        verbose_output: true
      - name: "test_driver_validation"
        description: "Comprehensive driver validation including sysfs, dependencies, kernel logs, and bind/unbind operations"
        enabled: true
        test_id: "F-K8-TC-004"
        pytest_file: "test_x86_f_k8_tc_004_validation.py"
        verbose_output: true
      - name: "test_device_node_exists"
        description: "Character device node /dev/simtemp exists"
        enabled: true
        test_id: "F-K3-TC-001"
        pytest_file: "test_x86_f_k3_simple.py"
        verbose_output: false
      - name: "test_alert_within_2_periods"
        description: "Alert within ≤ 2 periods; stats.alerts++"
        enabled: true
        test_id: "F-K5-TC-001"
        pytest_file: "test_x86_f_k5_tc_001_alert.py"
        verbose_output: true
      - name: "test_no_alert_when_threshold_greater"
        description: "No alert when threshold > value"
        enabled: true
        test_id: "F-K5-TC-002"
        pytest_file: "test_x86_f_k5_tc_001_alert.py"
        verbose_output: true
      - name: "test_periodic_sampling_functionality"
        description: "F-K2: Periodic sampling every N ms with low jitter"
        enabled: true
        test_id: "F-K2-TC-001"
        pytest_file: "test_x86_f_k2_tc_001_sampling.py"
        verbose_output: true

  qemu_integration:
    enabled: true
    repository: "simtemp-system"
    description: "QEMU i.MX6 Integration Tests for Jenkins CI/CD"
    binary_paths_profile: "arm_qemu"
    test_cases:
      - name: "test_basic_qemu_boot"
        description: "Boot on QEMU with no errors. Able to reuse QEMU session for further testing"
        enabled: true
        test_id: "F-K1-TC-002"
        pytest_file: "test_arm_f_k1_tc_002_boot.py"
        verbose_output: true
      - name: "test_qemu_driver_load_unload"
        description: "Load/unload kernel module in QEMU environment without WARN/OOPS"
        enabled: true
        test_id: "F-K8-TC-001-QEMU"
        pytest_file: "test_arm_f_k8_tc_001_loadunload.py"
        verbose_output: true
      - name: "test_platform_driver_validation"
        description: "Validate platform driver with Device Tree in QEMU environment"
        enabled: true
        test_id: "F-K1-TC-003-QEMU"
        pytest_file: "test_arm_f_k1_tc_003_platform.py"
        verbose_output: true
      - name: "test_dtb_overlay_exists"
        description: "Verifies DTB overlay compilation and existence"
        enabled: true
        test_id: "F-K8-TC-003-QEMU"
        pytest_file: "test_arm_f_k8_tc_003_dtbbind.py"
        verbose_output: true
      - name: "test_dtb_driver_binding_and_functionality"
        description: "Verifies DTB driver binding compatibility"
        enabled: true
        test_id: "F-K8-TC-003-QEMU-2"
        pytest_file: "test_arm_f_k8_tc_003_dtbbind.py"
        verbose_output: true
      - name: "test_periodic_sampling_arm_functionality"
        description: "F-K2: Periodic sampling every N ms in QEMU ARM environment"
        enabled: true
        test_id: "F-K2-TC-001-ARM"
        pytest_file: "test_arm_f_k2_tc_001_sampling.py"
        verbose_output: true
