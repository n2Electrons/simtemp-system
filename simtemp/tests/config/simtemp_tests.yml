# Test Configuration File for  Temperature Simulator Driver
# This file controls which tests are executed and their configurations
#
# Copyright (c) Jorge Rodriguez Moreno
#
# Test Case Configuration Options:
#   verbose_output: true/false - Controls pytest -s flag to show/hide print statements
#                               Set to true for debugging specific test cases

version: "1.0"

# Global test settings
global:
  verbose: true
  debug: true          # Enable detailed debug output
  timeout_seconds: 60  # Longer timeout for kernel module operations
  fail_fast: true     # Stop on first failure for kernel module safety

# GitHub issue mappings for test IDs (optional - can also be in separate JSON file)
github_issue_mappings:


# Test requirements
requirements:
  parent_requirement:
    source: "github_pr"
    id: "${GITHUB_PR_NUMBER}"  # Will be expanded by Jenkins
    enabled: true

# Test case configurations
tests:
  kernel_driver_base:
    enabled: true
    repository: "n2Electrons-Infra"  # GitHub repository for this test module  
    debug_verbose: true  # Enable detailed debug output for this module
    description: "Tests for the Temperature Simulator Driver (Infrastructure)"
    depends_on: ["nxp_simtemp"]  # Module dependency
    env:
      SOURCE_FILE: 'kernel/nxp_simtemp.c'
      MODULE_DIR: 'kernel'
      MODULE_NAME: 'nxp_simtemp.ko'
      BUILD_DIR: 'obj'
    module_path: "${MODULE_DIR}/${BUILD_DIR}/${MODULE_NAME}"
    test_cases:
      - name: "test_insmod_registers_driver"
        description: "test_insmod_registers_driver() - Verifies driver registration via insmod"
        enabled: true
        test_id: "F-K1-TC-001"  # Maps to test plan ID
        pytest_file: "test_f_k1_tc_001.py"  # Specific pytest file for this test case
        verbose_output: false  # Enable pytest -s flag to show print statements
        debug_info: "This test loads the kernel module using insmod"

  kernel_driver_suite:
    enabled: true
    repository: "simtemp-system"  # GitHub repository for this test module  
    debug_verbose: true  # Enable detailed debug output for this module
    description: "Extended Tests for the Temperature Simulator Driver"
    depends_on: ["nxp_simtemp"]  # Module dependency
    env:
      SOURCE_FILE: 'kernel/nxp_simtemp.c'
      MODULE_DIR: 'kernel'
      MODULE_NAME: 'nxp_simtemp.ko'
      BUILD_DIR: 'obj'
    module_path: "${MODULE_DIR}/${BUILD_DIR}/${MODULE_NAME}"
    test_cases:
      - name: "test_driver_load_unload"
        description: "test_driver_load_unload() - Load/unload kernel module without WARN/OOPS"
        enabled: true
        test_id: "F-K8-TC-001"
        pytest_file: "test_f_k8_tc_001.py"  # Specific pytest file for this test case
        verbose_output: false  # Disable verbose output for this test
        debug_info: "This test verifies clean module load/unload operations"
      - name: "test_f_k1_platform_driver_dt_registration"
        description: "test_f_k1_platform_driver_dt_registration() - TDD test for platform driver with Device Tree support"
        enabled: true
        test_id: "F-K1-TC-003"  # TDD test for platform driver registration
        pytest_file: "test_f_k1_tc_003.py"  # Comprehensive platform driver validation
        verbose_output: true  # Enable verbose output for TDD debugging
        debug_info: "TDD test - expected to fail until platform driver is implemented"

  qemu_integration:
    enabled: true
    repository: "simtemp-system"  # GitHub repository for this test module
    debug_verbose: true  # Enable detailed debug output for this module
    description: "QEMU i.MX6 Integration Tests for Jenkins CI/CD"
    
    # Driver compilation settings for QEMU tests
    use_precompiled_driver: true  # Set to true to use prebuilt nxp_simtemp.ko instead of compiling from source
    precompiled_path: "/tmp/prebuild/simtemp-driver/nxp_simtemp.ko"  # Path to precompiled driver in repository
    
    env:
      QEMU_DIR: 'deployment/qemu'
      HELLO_SRC_DIR: 'src/hello'
      KERNEL_IMAGE: '/workspace/deployment/qemu/linux-imx-5.10/arch/arm/boot/zImage'
      DTB_FILE: '/workspace/deployment/qemu/linux-imx-5.10/arch/arm/boot/dts/imx6q-sabresd.dtb'
      ROOTFS_IMAGE: '/workspace/deployment/qemu/rootfs.cpio.gz'
      # BUILD_SCRIPT removed - binaries are pre-compiled on host

    test_cases:
      - name: "test_basic_qemu_boot"
        description: "QEMU / test_basic_qemu_boot() - Verifies basic QEMU boot and kernel messages"
        enabled: true
        test_id: "F-K1-TC-002-QEMU"
        pytest_file: "test_f_k1_tc_002.py"  # Specific pytest file for this test case
        verbose_output: true  # Enable verbose output for debugging QEMU boot
        debug_info: "This test checks for successful QEMU boot and kernel log patterns"
        qemu_specific:
          expects_boot: true
          validation_patterns: ["Booting Linux", "initramfs ready"]

      - name: "test_f_k1_platform_driver_dt_registration"
        description: "QEMU / test_f_k1_platform_driver_dt_registration() - Validate platform driver with Device Tree in QEMU environment"
        enabled: true
        test_id: "F-K1-TC-003-QEMU"  # QEMU variant of platform driver test
        pytest_file: "test_f_k1_tc_003.py"  # Same test but detects QEMU mode internally
        verbose_output: true  # Enable verbose output for QEMU debugging
        debug_info: "TDD test for platform driver DT support in ARM QEMU environment"
        qemu_specific:
          expects_boot: true
          expects_module_load: true
          expects_dt_binding: true
          validation_patterns: ["initramfs ready", "platform", "simtemp", "Device Tree"]
          module_operations: ["insmod", "rmmod", "modinfo"]

      - name: "test_dtb_overlay_exists"
        description: "DTB / test_dtb_overlay_exists() - Verifies DTB overlay compilation and existence"
        enabled: true
        test_id: "F-K8-TC-003-A"
        pytest_file: "test_f_k8_tc_003_dtb.py"
        verbose_output: true
        debug_info: "Test for DTB overlay compilation and file existence verification"
        dtb_specific:
          expects_dtb_compilation: true
          validation_patterns: ["nxp-simtemp-overlay.dtbo"]
          required_tools: ["dtc"]

      - name: "test_dtb_driver_binding"
        description: "DTB / test_dtb_driver_binding() - Verifies DTB driver binding compatibility"
        enabled: true
        test_id: "F-K8-TC-003-B"
        pytest_file: "test_f_k8_tc_003_dtb.py"
        verbose_output: true
        debug_info: "Test for DTB driver binding verification using compatible strings"
        dtb_specific:
          expects_driver_binding: true
          validation_patterns: ["nxp,simtemp"]

      - name: "test_dtb_driver_binding_and_functionality"
        description: "DTB / test_dtb_driver_binding_and_functionality() - DTB driver binding and functionality verification"
        enabled: true
        test_id: "F-K8-TC-003"
        pytest_file: "test_f_k8_tc_003_dtb.py"  # Specific pytest file for DTB test
        verbose_output: true  # Enable verbose output for DTB debugging
        debug_info: "TDD test for DTB driver binding, Device Tree property parsing, and functionality verification"
        dtb_specific:
          expects_dtb_compilation: true
          expects_dtb_loading: true
          expects_driver_binding: true
          expects_property_parsing: true
          validation_patterns: ["nxp,simtemp", "sampling_ms", "threshold_mC", "mode"]
          required_tools: ["dtc"]  # Device Tree Compiler required
          overlay_properties:
            sampling_ms: 100
            threshold_mC: 75000
            mode: "continuous"

      - name: "device_tree_loading"
        description: "QEMU / device_tree_loading() - Verifies Device Tree loading in QEMU"
        enabled: false
        test_id: "F-K1-TC-004"
        pytest_file: "test_f_k1_tc_004.py"  # Specific pytest file for this test case
        debug_info: "This test confirms DTB loading and kernel recognition"
        qemu_specific:
          expects_dtb_load: true
          validation_patterns: ["Device tree", "imx6ul"]
