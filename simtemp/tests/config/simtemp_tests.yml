# Test Configuration File for  Temperature Simulator Driver
# This file controls which tests are executed and their configurations
#
# Copyright (c) Jorge Rodriguez Moreno
#
# Test Case Configuration Options:
#   verbose_output: true/false - Controls pytest -s flag to show/hide print statements
#                               Set to true for debugging specific test cases

version: "1.0"

# Global test settings
global:
  verbose: true
  debug: true          # Enable detailed debug output
  timeout_seconds: 60  # Longer timeout for kernel module operations
  fail_fast: true     # Stop on first failure for kernel module safety

# GitHub issue mappings for test IDs (optional - can also be in separate JSON file)
github_issue_mappings:


# Test requirements
requirements:
  parent_requirement:
    source: "github_pr"
    id: "${GITHUB_PR_NUMBER}"  # Will be expanded by Jenkins
    enabled: true

# Test case configurations
tests:
  kernel_driver_base:
    enabled: false
    repository: "n2Electrons-Infra"  # GitHub repository for this test module  
    debug_verbose: true  # Enable detailed debug output for this module
    description: "Tests for the Temperature Simulator Driver (Infrastructure)"
    depends_on: ["nxp_simtemp"]  # Module dependency
    env:
      SOURCE_FILE: 'kernel/nxp_simtemp.c'
      MODULE_DIR: 'kernel'
      MODULE_NAME: 'nxp_simtemp.ko'
      BUILD_DIR: 'obj'
    module_path: "${MODULE_DIR}/${BUILD_DIR}/${MODULE_NAME}"
    test_cases:
      - name: "insmod_registers_driver"
        description: "Verifies driver registration via insmod"
        enabled: true
        test_id: "F-K1-TC-001"  # Maps to test plan ID
        pytest_file: "test_f_k1_tc_001.py"  # Specific pytest file for this test case
        verbose_output: false  # Enable pytest -s flag to show print statements
        debug_info: "This test loads the kernel module using insmod"

  kernel_driver_suite:
    enabled: false
    repository: "simtemp-system"  # GitHub repository for this test module  
    debug_verbose: true  # Enable detailed debug output for this module
    description: "Extended Tests for the Temperature Simulator Driver"
    depends_on: ["nxp_simtemp"]  # Module dependency
    env:
      SOURCE_FILE: 'kernel/nxp_simtemp.c'
      MODULE_DIR: 'kernel'
      MODULE_NAME: 'nxp_simtemp.ko'
      BUILD_DIR: 'obj'
    module_path: "${MODULE_DIR}/${BUILD_DIR}/${MODULE_NAME}"
    test_cases:
      - name: "driver_load_unload"
        description: "Load/unload kernel module without WARN/OOPS"
        enabled: true
        test_id: "F-K8-TC-001"
        pytest_file: "test_f_k8_tc_001.py"  # Specific pytest file for this test case
        verbose_output: false  # Disable verbose output for this test
        debug_info: "This test verifies clean module load/unload operations"

  qemu_integration:
    enabled: true
    repository: "simtemp-system"  # GitHub repository for this test module
    debug_verbose: true  # Enable detailed debug output for this module
    description: "QEMU i.MX6 Integration Tests for Jenkins CI/CD"
    
    # Driver compilation settings for QEMU tests
    use_precompiled_driver: true  # Set to true to use prebuilt nxp_simtemp.ko instead of compiling from source
    precompiled_path: "/tmp/prebuild/simtemp-driver/nxp_simtemp.ko"  # Path to precompiled driver in repository
    
    env:
      QEMU_DIR: 'deployment/qemu'
      HELLO_SRC_DIR: 'src/hello'
      KERNEL_IMAGE: 'deployment/qemu/linux-imx-5.10/arch/arm/boot/zImage'
      DTB_FILE: 'deployment/qemu/linux-imx-5.10/arch/arm/boot/dts/imx6q-sabrelite.dtb'
      ROOTFS_IMAGE: 'deployment/qemu/rootfs-hello.cpio.gz'
      # BUILD_SCRIPT removed - binaries are pre-compiled on host
    test_cases:
      - name: "basic_qemu_boot"
        description: "Verifies basic QEMU boot and kernel messages"
        enabled: true
        test_id: "F-K1-TC-002"
        pytest_file: "test_f_k1_tc_002.py"  # Specific pytest file for this test case
        verbose_output: true  # Enable verbose output for debugging QEMU boot
        debug_info: "This test checks for successful QEMU boot and kernel log patterns"
        qemu_specific:
          expects_boot: true
          validation_patterns: ["Booting Linux", "initramfs ready"]
      - name: "device_tree_loading"
        description: "Verifies Device Tree loading in QEMU"
        enabled: false
        test_id: "F-K1-TC-004"
        pytest_file: "test_f_k1_tc_004.py"  # Specific pytest file for this test case
        debug_info: "This test confirms DTB loading and kernel recognition"
        qemu_specific:
          expects_dtb_load: true
          validation_patterns: ["Device tree", "imx6ul"]
      - name: "qemu_module_load_unload"
        description: "Load/unload kernel module in QEMU without WARN/OOPS"
        enabled: false
        test_id: "F-K8-TC-003"
        pytest_file: "test_f_k8_tc_003.py"  # Specific pytest file for this test case
        debug_info: "This test verifies clean module load/unload operations in QEMU environment"
        qemu_specific:
          expects_boot: true
          expects_module_load: true
          validation_patterns: ["initramfs ready", "nxp_simtemp"]
          module_operations: ["insmod", "rmmod", "lsmod"]
