# Test Configuration File for  Temperature Simulator Driver
# This file controls which tests are executed and their configurations
#
# Copyright (c) Jorge Rodriguez Moreno

version: "1.0"

# Global test settings
global:
  verbose: true
  debug: true          # Enable detailed debug output
  timeout_seconds: 60  # Longer timeout for kernel module operations
  fail_fast: true     # Stop on first failure for kernel module safety

# GitHub issue mappings for test IDs (optional - can also be in separate JSON file)
github_issue_mappings:


# Test requirements
requirements:
  parent_requirement:
    source: "github_pr"
    id: "${GITHUB_PR_NUMBER}"  # Will be expanded by Jenkins
    enabled: true

# Test case configurations
tests:
  jenkins_test:
    enabled: true
    own_pipeline: true  # This module has its own dedicated pipeline stage
    repository: "n2Electrons-Infra"  # GitHub repository for this test module (has JENKINS secrets)
    description: "Tests for Jenkins integration and PR detection"
    pytest_file: null  # No pytest file - these are Jenkins-specific tests
    env:
      SOURCE_FILE: 'deployment/jenkins/diagnostics.groovy'
      MODULE_DIR: 'jenkins'
      MODULE_NAME: 'diagnostics.groovy'
    test_cases:
      - name: "connectivity"
        description: "Verifies connectivity to Jenkins server"
        enabled: true
        test_id: "F-J1-TC-001"
      - name: "authentication" 
        description: "Verifies Jenkins authentication"
        enabled: true
        test_id: "F-J1-TC-002"
      - name: "pr_processing"
        description: "Verifies PR detection functionality"
        enabled: true
        test_id: "F-J1-TC-003"
      - name: "github_api_connectivity"
        description: "Validates GitHub API connectivity"
        enabled: true
        test_id: "F-J1-TC-004"
        
  kernel_driver_base:
    enabled: true
    repository: "n2Electrons-Infra"  # GitHub repository for this test module  
    debug_verbose: true  # Enable detailed debug output for this module
    description: "Tests for the Temperature Simulator Driver (Infrastructure)"
    depends_on: ["nxp_simtemp"]  # Module dependency
    pytest_file: "test_f_k1_tc_001.py"  # Specific pytest file for this module
    env:
      SOURCE_FILE: 'kernel/nxp_simtemp.c'
      MODULE_DIR: 'kernel'
      MODULE_NAME: 'nxp_simtemp.ko'
      BUILD_DIR: 'obj'
    module_path: "${MODULE_DIR}/${BUILD_DIR}/${MODULE_NAME}"
    test_cases:
      - name: "insmod_registers_driver"
        description: "Verifies driver registration via insmod"
        enabled: true
        test_id: "F-K1-TC-001"  # Maps to test plan ID
        debug_info: "This test loads the kernel module using insmod"

  kernel_driver_suite:
    enabled: true
    repository: "simtemp-system"  # GitHub repository for this test module  
    debug_verbose: true  # Enable detailed debug output for this module
    description: "Extended Tests for the Temperature Simulator Driver"
    depends_on: ["nxp_simtemp"]  # Module dependency
    pytest_file: "test_f_k8_tc_001.py"  # Specific pytest file for this module
    env:
      SOURCE_FILE: 'kernel/nxp_simtemp.c'
      MODULE_DIR: 'kernel'
      MODULE_NAME: 'nxp_simtemp.ko'
      BUILD_DIR: 'obj'
    module_path: "${MODULE_DIR}/${BUILD_DIR}/${MODULE_NAME}"
    test_cases:
      - name: "driver_load_unload"
        description: "Load/unload kernel module without WARN/OOPS"
        enabled: true
        test_id: "F-K8-TC-001"
        debug_info: "This test verifies clean module load/unload operations"

  qemu_integration:
    enabled: true
    repository: "simtemp-system"  # GitHub repository for this test module
    debug_verbose: true  # Enable detailed debug output for this module
    description: "QEMU i.MX6 Integration Tests for Jenkins CI/CD"
    pytest_file: "test_f_k1_tc_002.py"  # Specific pytest file for this module
    
    # QEMU execution configuration - tells Jenkins this runs in QEMU
    execution_environment:
      type: "qemu"  # Indicates this test suite runs in QEMU emulation
      platform: "arm"  # Target platform architecture
      machine: "virt"  # QEMU machine type
      cpu: "cortex-a15"  # Target CPU
      memory: "512M"  # QEMU memory allocation
      timeout_minutes: 10  # Total timeout for QEMU tests including boot time
      
    # QEMU-specific configuration
    qemu_config:
      runner_script: "deployment/qemu/scripts/run-f-k1-tc-002-jenkins.sh"  # Main QEMU test runner
      results_mount_path: "/mnt/workspace"  # Where workspace is mounted in QEMU
      auto_shutdown: true  # QEMU will auto-shutdown after tests
      console_output: true  # Capture QEMU console output
      
    # Results collection configuration for Jenkins
    results_collection:
      type: "shared_filesystem"  # Results shared via 9P filesystem
      output_formats: ["junit_xml", "json_report", "console_log"]
      results_base_path: "simtemp/tests/results"  # Relative to workspace root
      patterns:
        junit_xml: "*-qemu-results.xml"  # JUnit XML pattern for Jenkins
        json_report: "*-qemu-report.json"  # JSON test reports
        console_log: "*-qemu-console.log"  # QEMU console output
        artifacts: "test-results/*"  # Additional artifacts to archive
      
    env:
      QEMU_DIR: 'deployment/qemu'
      HELLO_SRC_DIR: 'src/hello'
      KERNEL_IMAGE: 'deployment/qemu/linux-imx-5.10/arch/arm/boot/zImage'
      DTB_FILE: 'deployment/qemu/linux-imx-5.10/arch/arm/boot/dts/imx6q-sabrelite.dtb'
      ROOTFS_IMAGE: 'deployment/qemu/rootfs-hello.cpio.gz'
      # BUILD_SCRIPT removed - binaries are pre-compiled on host
      TEST_SCRIPT: 'deployment/qemu/scripts/jenkins-hello-world-test.sh'
      # Results paths for QEMU environment
      QEMU_RESULTS_DIR: 'simtemp/tests/results'
      QEMU_WORKSPACE_MOUNT: '/mnt/workspace'
      
    test_cases:
      - name: "hello_world_qemu_boot"
        description: "Verifies QEMU i.MX6 boots with Hello World program"
        enabled: true
        test_id: "F-K1-TC-002"
        debug_info: "This test runs Hello World in QEMU i.MX6 emulation"
        timeout_seconds: 45  # QEMU test specific timeout
        qemu_specific:
          expects_kernel_boot: true
          expects_userspace: true
          validation_patterns: ["Hello World", "Test completed"]
      - name: "device_tree_loading"
        description: "Verifies Device Tree loading in QEMU"
        enabled: true
        test_id: "F-K1-TC-004"
        debug_info: "This test confirms DTB loading and kernel recognition"
        qemu_specific:
          expects_dtb_load: true
          validation_patterns: ["Device tree", "imx6ul"]
