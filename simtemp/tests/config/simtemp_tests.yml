# Test Configuration File for SimTemp Temperature Simulator Driver
# This file controls which tests are executed and their configurations
#
# Copyright (c) Jorge Rodriguez Moreno
#
# STRUCTURE DOCUMENTATION:
# =======================
# 
# Test Suite Required Fields:
#   - enabled: bool           # Whether the suite is active
#   - repository: str         # GitHub repository name
#   - description: str        # Human-readable suite description
#   - test_cases: list        # List of test case configurations
#
# Test Suite Optional Fields:
#   - use_precompiled_driver: bool     # Use pre-built driver binary
#   - precompiled_path: str            # Path to pre-built driver
#
# Test Case Required Fields:
#   - name: str              # Test function name
#   - description: str       # Human-readable test description
#   - enabled: bool          # Whether the test is active
#   - test_id: str          # Traceability ID (F-KX-TC-XXX format)
#   - pytest_file: str      # Python test file name
#   - verbose_output: bool  # Enable pytest -s flag for debugging

version: "1.0"

# Global test settings
global:
  verbose: true
  debug: true
  timeout_seconds: 60
  fail_fast: true

# GitHub issue mappings (populated by automation)
github_issue_mappings: {}

# Test case configurations
tests:
  kernel_driver_base:
    enabled: true
    repository: "n2Electrons-Infra"
    description: "Tests for the Temperature Simulator Driver (Infrastructure)"
    test_cases:
      - name: "test_insmod_registers_driver"
        description: "Verifies driver registration via insmod"
        enabled: true
        test_id: "F-K1-TC-001"
        pytest_file: "test_x86_f_k1_tc_001_insmod.py"
        verbose_output: false

  kernel_driver_suite:
    enabled: true
    repository: "simtemp-system"
    description: "Extended Tests for the Temperature Simulator Driver"
    test_cases:
      - name: "test_driver_load_unload"
        description: "Load/unload kernel module without WARN/OOPS"
        enabled: true
        test_id: "F-K8-TC-001"
        pytest_file: "test_x86_f_k8_tc_001_loadunload.py"
        verbose_output: false
      - name: "test_readers_exit_gracefully_on_unload"
        description: "Readers exit gracefully on unload in host environment"
        enabled: true
        test_id: "F-K8-TC-002"
        pytest_file: "test_x86_f_k8_tc_002_graceful.py"
        verbose_output: true
      - name: "test_driver_validation"
        description: "Comprehensive driver validation including sysfs, dependencies, kernel logs, and bind/unbind operations"
        enabled: true
        test_id: "F-K8-TC-004"
        pytest_file: "test_x86_f_k8_tc_004_validation.py"
        verbose_output: true

  qemu_integration:
    enabled: true
    repository: "simtemp-system"
    description: "QEMU i.MX6 Integration Tests for Jenkins CI/CD"
    use_precompiled_driver: true
    precompiled_path: "/tmp/prebuild/simtemp-driver/nxp_simtemp.ko"
    test_cases:
      - name: "test_basic_qemu_boot"
        description: "Verifies basic QEMU boot and kernel messages"
        enabled: true
        test_id: "F-K1-TC-002-QEMU"
        pytest_file: "test_arm_f_k1_tc_002_dtoverlay.py"
        verbose_output: true
      - name: "test_qemu_driver_load_unload"
        description: "Load/unload kernel module in QEMU environment without WARN/OOPS"
        enabled: true
        test_id: "F-K8-TC-001-QEMU"
        pytest_file: "test_arm_f_k8_tc_001_loadunload.py"
        verbose_output: true
      - name: "test_f_k1_platform_driver_dt_registration"
        description: "Validate platform driver with Device Tree in QEMU environment"
        enabled: true
        test_id: "F-K1-TC-003-QEMU"
        pytest_file: "test_arm_f_k1_tc_003_platform.py"
        verbose_output: true
      - name: "test_dtb_overlay_exists"
        description: "Verifies DTB overlay compilation and existence"
        enabled: true
        test_id: "F-K8-TC-003-QEMU"
        pytest_file: "test_arm_f_k8_tc_003_dtbbind.py"
        verbose_output: true
      - name: "test_dtb_driver_binding_and_functionality"
        description: "Verifies DTB driver binding compatibility"
        enabled: true
        test_id: "F-K8-TC-003-QEMU-2"
        pytest_file: "test_arm_f_k8_tc_003_dtbbind.py"
        verbose_output: true
